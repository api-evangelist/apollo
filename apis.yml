aid: apollo
name: Apollo
description: Apollo.io is an AI-powered B2B sales intelligence and engagement platform
  combining a database of 230M+ verified contacts and 30M+ companies with prospecting,
  outreach, and deal execution tools. The platform helps sales teams build pipeline,
  qualify inbound leads, enrich data, and close deals faster with AI-powered workflows
  and conversation intelligence.
