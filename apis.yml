aid: apollo
name: Apollo
description: >-
  Apollo provides a comprehensive GraphQL platform including Apollo Client for
  consuming GraphQL APIs from web and mobile apps, Apollo Server for building
  GraphQL services, Apollo Router for federated supergraph routing, and code
  generation tools for producing type-safe GraphQL operations.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - Code Generation
  - Federation
  - GraphQL
  - SDKs
url: >-
  https://raw.githubusercontent.com/api-evangelist/apollo/refs/heads/main/apis.yml
created: '2026-03-25'
modified: '2026-03-25'
specificationVersion: '0.19'
apis:
  - aid: apollo:apollo-client
    name: Apollo Client
    description: >-
      Apollo Client is a comprehensive state management library for JavaScript
      that enables you to manage both local and remote data with GraphQL,
      with integrations for React, Vue, Angular, and more.
    humanURL: https://www.apollographql.com/apollo-client
    tags:
      - Client Libraries
      - GraphQL
      - SDKs
    properties:
      - type: Documentation
        url: https://www.apollographql.com/docs/react/
      - type: Getting Started
        url: https://www.apollographql.com/docs/react/get-started
      - type: GitHub Repository
        url: https://github.com/apollographql/apollo-client
  - aid: apollo:apollo-server
    name: Apollo Server
    description: >-
      Apollo Server is an open source GraphQL server that works with any
      GraphQL schema and supports production-ready features like caching,
      error handling, and federation.
    humanURL: https://www.apollographql.com/docs/apollo-server/
    tags:
      - GraphQL
      - Server
    properties:
      - type: Documentation
        url: https://www.apollographql.com/docs/apollo-server/
      - type: GitHub Repository
        url: https://github.com/apollographql/apollo-server
