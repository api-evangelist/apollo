- type: Features
  data:
  - name: Outbound Prospecting
    description: AI-powered multichannel outbound campaigns with email deliverability
      guardrails and workflow automations.
  - name: Inbound Lead Qualification
    description: Anonymous visitor identification, real-time form enrichment, instant
      routing, and automated follow-ups.
  - name: Data Enrichment
    description: Enrich contact and company records with always-fresh data from 230M+
      verified contacts and 30M+ companies.
  - name: Deal Execution
    description: Pre-meeting insights, AI call summaries, pipeline boards, and coaching
      dashboards.
  - name: AI Assistant
    description: AI-powered assistant for automating sales research, writing, and
      workflow tasks.
  - name: Conversation Intelligence
    description: Call recording, AI call summaries, and conversation analytics for
      sales coaching.
  - name: Chrome Extension
    description: Browser extension for accessing Apollo data and workflows directly
      from any website.
  - name: Workflow Automation
    description: No-code workflow automation engine for sales process automation.
  - name: Email Deliverability
    description: Email deliverability guardrails to protect sender reputation and
      maximize inbox placement.
  - name: Meeting Scheduler
    description: Integrated meeting scheduling functionality linked to sales workflows.
- type: UseCases
  data:
  - name: Outbound Sales Prospecting
    description: Find and engage ideal prospects at scale using Apollo's contact database
      and multichannel outreach.
  - name: Inbound Lead Management
    description: Automatically qualify, route, and follow up on inbound leads in real
      time.
  - name: CRM Data Enrichment
    description: Enrich Salesforce, HubSpot, and other CRM records with verified contact
      and company data.
  - name: Sales Pipeline Building
    description: Build and manage sales pipeline with AI-assisted prospecting and
      deal execution tools.
  - name: Partner API Integration
    description: Build third-party integrations using OAuth 2.0 to access Apollo data
      on behalf of customers.
- type: Integrations
  data:
  - name: Salesforce
    description: Bi-directional Salesforce CRM integration syncing contacts, accounts,
      activities, and sequences.
  - name: HubSpot
    description: HubSpot CRM integration for syncing contact data and outreach activity.
  - name: Gmail
    description: Gmail integration for email tracking and outreach directly from inbox.
  - name: Outlook
    description: Microsoft Outlook integration for email tracking and outreach.
  - name: LinkedIn
    description: LinkedIn integration via Chrome extension for prospecting and data
      enrichment.
  - name: Zapier
    description: Zapier integration for connecting Apollo to hundreds of other applications.
  - name: Slack
    description: Slack integration for deal alerts and notifications.
- type: LlmsText
  url: https://docs.apollo.io/llms.txt
